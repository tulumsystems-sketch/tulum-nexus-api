spring.application.name=TulumCore
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
server.address=0.0.0.0
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=30000

# =============================================
# CORS
# =============================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://tulum-core.netlify.app,https://teal-tanuki-dea827.netlify.app,http://localhost:3000,http://localhost:5173}

# =============================================
# BASE DE DATOS
# =============================================
spring.datasource.url=${DATABASE_URL:${DB_URL:jdbc:postgresql://localhost:5432/tulum_core}}
spring.datasource.username=${DATABASE_USERNAME:${DB_USERNAME:tulum_user}}
spring.datasource.password=${DATABASE_PASSWORD:${DB_PASSWORD:change-me}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.tenant_identifier_resolver=com.tulumcore.api.config.TenantIdentifierResolver
spring.jpa.open-in-view=false

# Migraciones: el schema de produccion ya existe. baseline marca V1 como aplicada y corre V2+.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# =============================================
# CLOUDINARY
# =============================================
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:demo-cloud}
cloudinary.api_key=${CLOUDINARY_API_KEY:demo-api-key}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:demo-api-secret}

# =============================================
# JWT
# =============================================
jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me-change-me}
jwt.expiration-ms=${JWT_EXPIRATION_MS:43200000}

# Bot WhatsApp: vacío = apagado. El header X-Bot-Secret tiene que coincidir y el tenant tener WHATSAPP_BOT.
app.bot.shared-secret=${BOT_SHARED_SECRET:}

# Caja: un turno dura un día. A las 24h se cierra solo con el esperado del sistema.
app.caja.max-horas-abierta=${CAJA_MAX_HORAS_ABIERTA:24}
app.caja.cierre-automatico-ms=${CAJA_CIERRE_AUTOMATICO_MS:300000}
# Sesión: el front cierra si no hay actividad. El JWT es el techo absoluto.
app.sesion.inactividad-minutos=${SESION_INACTIVIDAD_MINUTOS:30}

# =============================================
# MERCADO PAGO
# =============================================
mercadopago.access-token=${MP_ACCESS_TOKEN:}
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}

# =============================================
# SEED SUPER ADMIN
# =============================================
app.seed.super-admin.enabled=${SUPERADMIN_SEED_ENABLED:false}
app.seed.super-admin.email=${SUPERADMIN_EMAIL:}
app.seed.super-admin.password=${SUPERADMIN_PASSWORD:}
app.seed.super-admin.tenant=${SUPERADMIN_TENANT:superadmin}

# =============================================
# UPLOADS
# =============================================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
