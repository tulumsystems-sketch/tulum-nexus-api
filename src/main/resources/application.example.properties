spring.application.name=TulumCore
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

# =============================================
# CORS
# =============================================
# Lista separada por comas. En produccion incluir el dominio real de Netlify.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://tulum-core.netlify.app,https://teal-tanuki-dea827.netlify.app,http://localhost:3000,http://localhost:5173}

# =============================================
# BASE DE DATOS
# =============================================
spring.datasource.url=${DATABASE_URL:${DB_URL:jdbc:postgresql://localhost:5432/tulum_core}}
spring.datasource.username=${DATABASE_USERNAME:${DB_USERNAME:tulum_user}}
spring.datasource.password=${DATABASE_PASSWORD:${DB_PASSWORD:change-me}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# En produccion debe ser none. El schema lo mueve Flyway, no Hibernate.
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:none}
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.tenant_identifier_resolver=com.tulumcore.api.config.TenantIdentifierResolver
spring.jpa.open-in-view=false

# =============================================
# CLOUDINARY
# =============================================
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:demo-cloud}
cloudinary.api_key=${CLOUDINARY_API_KEY:demo-api-key}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:demo-api-secret}

# =============================================
# JWT
# =============================================
# Usar un secreto largo y aleatorio en cada entorno real.
# La API no arranca si el valor es el de ejemplo o tiene menos de 32 caracteres.
jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me-change-me}
jwt.expiration-ms=${JWT_EXPIRATION_MS:43200000}
app.bot.shared-secret=${BOT_SHARED_SECRET:}
app.caja.max-horas-abierta=${CAJA_MAX_HORAS_ABIERTA:24}
app.caja.cierre-automatico-ms=${CAJA_CIERRE_AUTOMATICO_MS:300000}
app.sesion.inactividad-minutos=${SESION_INACTIVIDAD_MINUTOS:30}

# =============================================
# MERCADO PAGO
# =============================================
# Token global opcional. El flujo actual usa credenciales por tenant cuando estan configuradas.
mercadopago.access-token=${MP_ACCESS_TOKEN:TEST-0000000000000000-000000-00000000000000000000000000000000-000000000}
# Secreto de Webhooks del panel de Mercado Pago. Sin esto, las notificaciones se ignoran.
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}

# =============================================
# SEED SUPER ADMIN
# =============================================
# Mantener deshabilitado en produccion. Si se habilita, definir email/password por entorno.
app.seed.super-admin.enabled=${SUPERADMIN_SEED_ENABLED:false}
app.seed.super-admin.email=${SUPERADMIN_EMAIL:admin.local@example.com}
app.seed.super-admin.password=${SUPERADMIN_PASSWORD:change-me-local-only}
app.seed.super-admin.tenant=${SUPERADMIN_TENANT:superadmin}

# =============================================
# UPLOADS
# =============================================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
